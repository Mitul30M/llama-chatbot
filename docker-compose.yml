version: "3.8"
services:
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server","--appendonly","yes"]

  web:
    build: .
    container_name: llama-chatbot-web
    ports:
      - "3000:3000"
    environment:
      # inside compose network the redis host is "redis"
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      # allow the web container to reach the Ollama daemon running on the host
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - ./logs:/app/logs
    depends_on:
      - redis

volumes:
  redis-data:
